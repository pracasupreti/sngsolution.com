            class="flex flex-wrap -mx-4 justify-center"

            <!-- Events will be dynamically rendered here -->

      <script>
        const events = [
          {
            image: "images/events/22feb2025.jpg",
            date: "22 Feb 2025",
            location: "Bharatpur, Chitwan",
            title: "Debt Recovery & Risk Management workshop",
            description:
              "SNG Solution successfully conducted the Effective Debt Recovery & Risk Management workshop on February 22, 2025, in Bharatpur, Chitwan. The session brought together mid-level banking officers (BM/RO/RM) to enhance their expertise in tackling debt recovery challenges and risk management strategies.",
          },
          {
            image: "images/events/credit-marketing-mantra.jpg",
            date: "31 Jan-1 Feb 2025",
            location: "Butwal, Nepal",
            title: "Credit Marketing Mantra",
            description:
              "We are thrilled to announce the successful completion of the Credit Marketing Mantra Workshop conducted for the Lumbini Cluster staff of Citizens Bank International Ltd. We would also like to extend our heartfelt gratitude to the core team of Citizens Bank International Ltd. for their support and collaboration in making this workshop a resounding success. <br><br> The workshop provided a perfect blend of theory and practice, empowering participants with actionable insights to enhance their credit marketing and risk management capabilities. We look forward to more such collaborations and wish all participants continued success in building resilient credit portfolios! 🌟",
          },
          {
            image: "images/events/1.jpg",
            date: "26 October 2024",
            location: "Hotel Yak & Yeti, Kathmandu",
            title:
              "Workshop on Digital Transformation & Cybersecurity in Nepal’s Insurance Sector",
            description:
              "Organized for IT Officials, ISOs, Risk & Compliance Officers from various Life, Non-life, and Micro Insurance companies in Nepal, SNG Solution hosted an impactful workshop, Digital Transformation & Cybersecurity in Nepal’s Insurance Sector, at Hotel Yak & Yeti. The event aimed to equip mid-level officers, managers, and directors with knowledge on digital insurance policies, cybersecurity measures, and the implications of Nepal's latest IT regulations for the insurance industry. <br><br> Led by experts such as Mr. Rabindra Shrestha from the Nepal Insurance Authority, Mr. Narayan Timilsina of MoCST, and Mr. Raj Kumar Maharjan from the National Cybersecurity Cell, the workshop covered critical topics like the Digital Insurance Policy Guidelines, 2024, and emerging cybersecurity threats specific to insurance. The event concluded with actionable strategies for enhancing cyber resilience in Nepal's evolving digital landscape.",
          },
          {
            image: "images/events/14dec2024.jpg",
            date: "14 December 2024",
            location: "Hotel Hilton, Kathmandu",
            title: "Workshop on Banking Offense, Fraud and Operational Risk",
            description:
              'SNG Solutions Pvt. Ltd. successfully organized a workshop on "Banking Offence, Fraud, and Operational Risk Management" at Hilton Kathmandu Hotel, bringing together banking professionals, industry leaders, and cybersecurity experts. The event featured key modules led by distinguished speakers: Dilli Ram Neupane on legal frameworks, Nara Bahadur Thapa on fraud and forgery, and Raju Nepal on operational risk management.<br><br> Interactive sessions, including fraud scenario analysis and cybersecurity training, provided participants with practical insights and tools to tackle emerging challenges. The workshop emphasized fostering a secure and resilient banking environment in Nepal’s evolving financial sector.',
          },
          {
            image: "images/events/2.jpg",
            date: "January 27-30, 2024",
            location: "Hotel Hilton, Kathmandu",
            title:
              "Refresher Course on Cybersecurity Legal & Regulatory Framework in Nepal",
            description:
              "Organized for IT Officials, ISOs, Risk & Compliance Officers from Banks & Financial Institutions, PSPs, PSOs, Software Companies, ISPs, IT Consulting Companies, IT Vendors etc. SNG Solution held a focused Refresher Course on Cybersecurity Legal & Regulatory Framework in Nepal, aimed at empowering professionals with an in-depth understanding of Nepal's cybersecurity landscape. This one-day course provided valuable insights into key regulations and policies essential for protecting digital assets and ensuring secure electronic transactions. <br><br> With modules led by expert facilitators including Er. Krishna Ram Dhunju, Director of IT at NRB’s Payment Systems Department, Mr. Vivek Rana, IT Strategist and Enterprise Architect, and Mr. Bijay Kumar Roy, Director at Nepal Telecommunication Authority, the course covered the National Cybersecurity Policy 2023, the Electronic Transaction and Digital Signature Act, and NRB's Cyber Resilience Guidelines. Participants engaged in interactive sessions on privacy laws, practical security assessments, and group workshops, gaining actionable knowledge to bolster cybersecurity in the financial sector. The course concluded with an open Q&A, certificate distribution, and feedback, leaving participants equipped to address the evolving challenges of digital security in Nepal.",
          },
          {
            image: "images/events/3.jpg",
            date: "11 August 2023",
            location: "Aloft Thamel, Kathmandu",
            title: "Workshop on Fintech & Cybersecurity",
            description:
              "On August 26, 2023, SNG Solution hosted a comprehensive workshop on Fintech & Cybersecurity at Aloft Kathmandu Hotel, bringing together professionals from financial institutions and fintech firms. Led by Mr. Prahlad Giri, Deputy Director at Nepal Rastra Bank, and Mr. Kumar Pudashine, Senior Section Chief at Agricultural Development Bank Ltd, the workshop covered the evolving fintech landscape, emphasizing regulatory frameworks, cybersecurity challenges, and governance. <br><br> Key modules explored topics such as digital transformation, decentralized finance (DeFi), regulatory sandboxes, and cybersecurity standards (ISO 27001:2013 and 2022). Participants engaged in discussions on payment systems, grievance handling mechanisms, and the application of the COBIT framework for financial governance. With hands-on exercises, open discussions, and interactive Q&A sessions, the event provided valuable insights into securing digital transactions and addressing compliance requirements. The workshop concluded with certificate distribution, equipping participants with practical knowledge essential for navigating the rapidly changing financial technology landscape.",
          },
          {
            image: "images/events/5.jpg",
            date: "27 Jan 2023",
            location: "Lalitpur",
            title:
              "Workshop on Nepal’s Economy & Banking Issues for Sipradi Trading Pvt Ltd.",
            description:
              "SNG Solution organized an in-depth training program on Economy & Banking Issues as part of the Corporate Knowledge Series for Sipradi Trading Pvt. Ltd. Held at Lalitpur, the program attracted top executives of Sipradi Trading Pvt Ltd eager to gain insights into Nepal's evolving economic landscape and regulatory frameworks.<br><br> The training covered pressing topics such as the current economic status, NRB's regulatory directives, banking fraud prevention, and digital banking advancements, including cybersecurity essentials. Key modules included in-depth discussions on Nepal's monetary policy, AML/CFT regulations, the impacts of financial fraud, and the importance of IT security. This engaging, one-day program aimed to enhance participants' understanding of macroeconomic challenges and empower them with practical tools for effective compliance and risk management.",
          },
          {
            image: "images/events/janakpur.jpg",
            date: "28 May 2022",
            location: "Janakpur",
            title: "Compliance & Banking Issues",
            description:
              "SNG Solution successfully conducted a refresher course titled Compliance & Banking Issues in Janakpur. Led by esteemed trainers Mr. Prahlad Giri, Deputy Director at Nepal Rastra Bank, and Mr. Prabhakar Jha, Assistant Director in the Economic Analysis Division, the course covered essential aspects of compliance, banking challenges, and effective office management. Key sessions included insights on Nepal’s economic status, monetary policies, recent banking issues, and updated NRB directives.<br><br> Additionally, the event explored the significance of social media etiquette and office productivity for professionals. Mr. Giri shared his expertise in NRB supervision and social media best practices, while Mr. Jha led discussions on current economic trends and regulatory updates. The workshop concluded with a feedback session, enhancing participants’ knowledge of compliance practices crucial for stable banking operations.",
          },
        ];

        function renderEvents() {
          const container = document.getElementById("events-container");
          container.innerHTML = events
            .map(
              (event) => `
      <div class="w-full md:w-1/2 lg:w-1/2 px-6">
        <div class="max-w-[500px] mx-auto mb-10">
          <div class="rounded overflow-hidden mb-8">
            <img src="${event.image}" alt="${event.title}" class="w-full" />
          </div>
          <div>
            <span class="bg-primary rounded inline-block text-center py-1 px-4 text-xs leading-loose font-semibold text-white mb-5">
              ${event.date}
            </span>
            <span class="bg-primary rounded inline-block text-center py-1 px-4 text-xs leading-loose font-semibold text-white mb-5">
              ${event.location}
            </span>
            <h3>
              <a href="javascript:void(0)" class="font-semibold text-xl sm:text-2xl lg:text-xl xl:text-2xl mb-4 inline-block text-dark hover:text-primary">
                ${event.title}
              </a>
            </h3>
            <p class="text-base text-body-color text-justify">
              ${event.description}
            </p>
          </div>
        </div>
      </div>
    `,
            )
            .join("");
        }

        document.addEventListener("DOMContentLoaded", renderEvents);
      </script>
